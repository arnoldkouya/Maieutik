[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maieutik"
version = "0.1.0"
description = "Un agent professeur qui t'apprend à coder en codant avec toi, sans coder à ta place."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2",
    "pytest>=8",
]

[project.scripts]
maieutik = "maieutik.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maieutik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
