[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maieutik"
version = "0.2.0"
description = "Un agent qui code avec toi et t'explique chaque modification, en rendant les risques de sécurité visibles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2",
    "pytest>=8",
]

[project.scripts]
maieutik = "maieutik.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maieutik"]

# Le skill est la source unique de la méthode et des projets : on l'embarque tel quel.
[tool.hatch.build.targets.wheel.force-include]
"skills/maieutik" = "maieutik/_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
